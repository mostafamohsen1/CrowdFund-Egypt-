{% extends 'base.html' %}

{% block title %}Password Reset Complete | CrowdFund Egypt{% endblock %}

{% block content %}
<div class="container py-5 text-center my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="p-5 bg-white rounded-4 border shadow-sm">
                <i class="bi bi-check-circle-fill fs-1 text-success d-block mb-3"></i>
                <h3 class="fw-bold mb-2">Password Changed Successfully!</h3>
                <p class="text-muted mb-4">
                    Your password has been set. You can now log in with your new credentials.
                </p>
                <a href="{% url 'login' %}" class="btn btn-cf-primary px-4 py-2">Log In Now</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
