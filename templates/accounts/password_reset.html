{% extends 'base.html' %}

{% block title %}Reset Password | CrowdFund Egypt{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 text-center">
                    <h3 class="fw-bold mb-1"><i class="bi bi-key-fill text-accent me-2"></i> Reset Password</h3>
                    <p class="small text-muted mb-0">Enter your registered email to receive a password reset link</p>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" id="id_email" class="form-control form-control-lg" placeholder="you@example.com" required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-cf-primary btn-lg">Send Password Reset Link</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light p-3 text-center small text-muted">
                    Remembered your password? <a href="{% url 'login' %}" class="fw-bold text-primary">Back to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
