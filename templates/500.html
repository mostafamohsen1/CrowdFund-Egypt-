{% extends 'base.html' %}

{% block title %}500 - Server Error | CrowdFund Egypt{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="display-1 fw-bold text-danger mb-3" style="font-size: 6rem;">500</div>
            <h2 class="fw-bold mb-3">Server Error</h2>
            <p class="text-muted mb-4">

            <a href="{% url 'home' %}" class="btn btn-cf-primary px-4 py-2">
                <i class="bi bi-house-door-fill me-2"></i> Back to Homepage
            </a>
        </div>
    </div>
</div>
{% endblock %}
